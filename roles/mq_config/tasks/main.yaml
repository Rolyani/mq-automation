- name: Check if queue manager exists
  ansible.builtin.command: "{{ mq_install_dir }}/bid/dspmq -m {{ mq_qmgr }}"
  register: qm_check
  changed_when: false
  failed_when: false
  become: true
  become_user: mqm

- name: Create queue manager
  ansible.builtin.command: "{{ mq_install_dir }}/bin/crtmqm {{ mq_qmgr }}"
  when: qm_check.rc != 0
  changed_when: true
  become: true
  become_user: mqm

- name: Check whether queue manager is running
  ansible.builtin.command: "{{ mq_install_dir }}/bin/dspmq -m {{ mq_qmgr }} -o status"
  register: qm_status
  changed_when: false
  become: true
  become_user: mqm

- name: Start queue manager
  ansible.builtin.command: "{{ mq_install_dir }}/bin/strmqm {{ mq_qmgr }}"
  when: "'Running' not in qm_status.stdout"
  changed_when: true
  become: true
  become_user: mqm

- name: Render MQSC definitions
  ansible.builtin.template:
    src: queues.mqsc.j2
    dest: "/var/mqm/{{ mq_qmgr }}.mqsc"
    owner: mqm
    group: mqm
    mode: "0640"
  become: true
  notify: Apply MQSC
